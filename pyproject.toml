[project]
name = "langchain-blackhorse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ccrriss", email = "https://github.com/ccrriss/Langchain_demo_bh" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.2",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "langchain_cook_assistant"

[dependency-groups]
dev = []
