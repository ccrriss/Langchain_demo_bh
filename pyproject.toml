[project]
name = "langchain-blackhorse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ccrriss" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.2",
    "fastmcp>=3.4.11",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "langchain_cook_assistant",
    "langchain_marry_assistant"
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.43",
]
